[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depfresh"
version = "0.1.0"
description = "Audit project dependencies for staleness, license risk, and unused packages."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
depfresh = "depfresh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
